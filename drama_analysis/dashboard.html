<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 台灣劇集推薦數據視覺化儀表板</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-primary: #0b0f19;
            --bg-secondary: #131a2e;
            --bg-card: rgba(30, 41, 59, 0.4);
            --bg-card-hover: rgba(30, 41, 59, 0.6);
            --border-color: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(99, 102, 241, 0.4);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-purple: #a855f7;
            --accent-indigo: #6366f1;
            --accent-pink: #ec4899;
            --accent-cyan: #06b6d4;
            --gradient-accent: linear-gradient(135deg, var(--accent-indigo), var(--accent-purple));
            --shadow-glow: 0 8px 32px 0 rgba(99, 102, 241, 0.15);
            --shadow-hover: 0 12px 40px 0 rgba(168, 85, 247, 0.25);
            --font-outfit: 'Outfit', 'Noto Sans TC', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: var(--font-outfit);
            scrollbar-width: thin;
            scrollbar-color: var(--accent-indigo) var(--bg-primary);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--accent-indigo);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-purple);
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(99, 102, 241, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(168, 85, 247, 0.1) 0%, transparent 45%);
            background-attachment: fixed;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* Header Style */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2.5rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1.5rem;
        }

        .header-title h1 {
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(to right, #ffffff, #c084fc, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
            margin-bottom: 0.5rem;
        }

        .header-title p {
            color: var(--text-secondary);
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .badge-live {
            background-color: rgba(236, 72, 153, 0.2);
            color: var(--accent-pink);
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            border: 1px solid rgba(236, 72, 153, 0.3);
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.7; }
            50% { opacity: 1; box-shadow: 0 0 8px rgba(236, 72, 153, 0.4); }
            100% { opacity: 0.7; }
        }

        /* Overview Stat Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2.5rem;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.5rem;
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            gap: 1.2rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: var(--gradient-accent);
            opacity: 0.8;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            border-color: var(--border-hover);
            box-shadow: var(--shadow-glow);
        }

        .stat-icon {
            width: 52px;
            height: 52px;
            border-radius: 12px;
            background: rgba(99, 102, 241, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: var(--accent-indigo);
            border: 1px solid rgba(99, 102, 241, 0.2);
        }

        .stat-card:nth-child(2) .stat-icon {
            background: rgba(168, 85, 247, 0.15);
            color: var(--accent-purple);
            border-color: rgba(168, 85, 247, 0.2);
        }
        .stat-card:nth-child(3) .stat-icon {
            background: rgba(6, 182, 212, 0.15);
            color: var(--accent-cyan);
            border-color: rgba(6, 182, 212, 0.2);
        }
        .stat-card:nth-child(4) .stat-icon {
            background: rgba(236, 72, 153, 0.15);
            color: var(--accent-pink);
            border-color: rgba(236, 72, 153, 0.2);
        }

        .stat-info {
            display: flex;
            flex-direction: column;
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: 800;
            line-height: 1.2;
            color: var(--text-primary);
        }

        .stat-label {
            font-size: 0.85rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 2px;
        }

        /* Charts Section */
        .charts-row {
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: 2rem;
            margin-bottom: 3rem;
        }

        @media (max-width: 1024px) {
            .charts-row {
                grid-template-columns: 1fr;
            }
        }

        .chart-box {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 1.8rem;
            backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            min-height: 420px;
        }

        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chart-title {
            font-size: 1.2rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            color: var(--text-primary);
        }

        .chart-title i {
            color: var(--accent-indigo);
        }

        .chart-container {
            position: relative;
            flex-grow: 1;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Main Drama Section Layout */
        .main-layout {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 2rem;
        }

        @media (max-width: 900px) {
            .main-layout {
                grid-template-columns: 1fr;
            }
        }

        /* Sidebar Filter Style */
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .filter-group {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 1.5rem;
            backdrop-filter: blur(12px);
        }

        .filter-title {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 1.2rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 0.6rem;
        }

        .filter-title i {
            color: var(--accent-purple);
        }

        .badge-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .filter-badge {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--text-secondary);
            padding: 0.4rem 0.8rem;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .filter-badge:hover {
            background: rgba(99, 102, 241, 0.1);
            color: var(--text-primary);
            border-color: rgba(99, 102, 241, 0.3);
        }

        .filter-badge.active {
            background: var(--gradient-accent);
            color: white;
            border-color: transparent;
            box-shadow: 0 0 12px rgba(99, 102, 241, 0.3);
        }

        .filter-badge .badge-count {
            background: rgba(0, 0, 0, 0.25);
            color: rgba(255, 255, 255, 0.7);
            border-radius: 20px;
            padding: 0.05rem 0.35rem;
            font-size: 0.7rem;
            font-weight: 600;
        }

        .filter-badge.active .badge-count {
            background: rgba(255, 255, 255, 0.2);
            color: white;
        }

        /* Search input */
        .search-container {
            position: relative;
            margin-bottom: 1.5rem;
        }

        .search-input {
            width: 100%;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 0.9rem 1rem 0.9rem 2.8rem;
            color: var(--text-primary);
            font-size: 0.9rem;
            outline: none;
            transition: all 0.3s ease;
            backdrop-filter: blur(12px);
        }

        .search-input:focus {
            border-color: var(--accent-indigo);
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.15);
        }

        .search-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            font-size: 1rem;
        }

        /* Drama Cards Container */
        .dramas-container {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .dramas-grid-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .results-count {
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 500;
        }

        .results-count span {
            color: var(--accent-indigo);
            font-weight: 700;
        }

        /* Drama Card Design */
        .drama-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 1.8rem;
            backdrop-filter: blur(12px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.2rem;
            position: relative;
            overflow: hidden;
        }

        .drama-card:hover {
            transform: scale(1.005) translateY(-4px);
            border-color: var(--border-hover);
            box-shadow: var(--shadow-glow);
            background: var(--bg-card-hover);
        }

        .drama-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .drama-title-area {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }

        .drama-title {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .drama-cast {
            font-size: 0.9rem;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .drama-cast i {
            color: var(--accent-purple);
        }

        .drama-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
        }

        .genre-badge {
            background: rgba(168, 85, 247, 0.1);
            border: 1px solid rgba(168, 85, 247, 0.25);
            color: #d8b4fe;
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .platform-badge {
            background: rgba(6, 182, 212, 0.1);
            border: 1px solid rgba(6, 182, 212, 0.25);
            color: #99f6e4;
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .platform-badge i {
            font-size: 0.7rem;
        }

        .release-badge {
            background: rgba(251, 146, 60, 0.1);
            border: 1px solid rgba(251, 146, 60, 0.25);
            color: #fed7aa;
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .drama-summary {
            font-size: 0.92rem;
            color: var(--text-secondary);
            line-height: 1.6;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            padding-top: 1rem;
            transition: all 0.3s ease;
        }

        /* Toggle Detail Button */
        .toggle-btn {
            background: transparent;
            border: none;
            color: var(--accent-indigo);
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            margin-top: 0.5rem;
            align-self: flex-start;
            transition: color 0.2s ease;
        }

        .toggle-btn:hover {
            color: var(--accent-purple);
        }

        .toggle-btn i {
            transition: transform 0.2s ease;
        }

        .toggle-btn.active i {
            transform: rotate(180deg);
        }

        .summary-content {
            display: none;
            animation: fadeIn 0.4s ease forwards;
        }

        .summary-content.show {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* No Results card */
        .no-results {
            background: var(--bg-card);
            border: 1px dashed rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 4rem 2rem;
            text-align: center;
            color: var(--text-secondary);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }

        .no-results i {
            font-size: 3rem;
            color: rgba(99, 102, 241, 0.4);
        }

        .no-results h3 {
            font-size: 1.2rem;
            color: var(--text-primary);
        }

        footer {
            margin-top: 5rem;
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.85rem;
            border-top: 1px solid var(--border-color);
            padding-top: 2rem;
            padding-bottom: 2rem;
        }

        footer a {
            color: var(--accent-indigo);
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>

    // State Variables
    let activeGenreFilter = 'all-genres';
    let activePlatformFilter = 'all-platforms';
    let searchQuery = '';

    // Initialize Page
    document.addEventListener("DOMContentLoaded", () => {
        setupFilters();
        renderDramas();
        renderCharts();
        
        // Search bar listener
        document.getElementById('search-bar').addEventListener('input', (e) => {
            searchQuery = e.target.value.toLowerCase().trim();
            renderDramas();
        });
    });

    // Helper to calculate statistics
    function getStats() {
        const genresCount = {};
        const platformsCount = {};
        let uniqueGenres = new Set();
        let uniquePlatforms = new Set();

        dramasData.forEach(d => {
            // Process genres
            const gs = d.genre.split('、');
            gs.forEach(g => {
                g = g.trim();
                genresCount[g] = (genresCount[g] || 0) + 1;
                uniqueGenres.add(g);
            });

            // Process platforms
            const ps = d.platform.split('、');
            ps.forEach(p => {
                p = p.trim();
                platformsCount[p] = (platformsCount[p] || 0) + 1;
                uniquePlatforms.add(p);
            });
        });

        return {
            genresCount,
            platformsCount,
            totalGenres: uniqueGenres.size,
            totalPlatforms: uniquePlatforms.size
        };
    }

    // Set up Filters on Sidebar
    function setupFilters() {
        const stats = getStats();
        
        // Genre filter setup
        const genreFiltersContainer = document.getElementById('genre-filters');
        const sortedGenres = Object.entries(stats.genresCount).sort((a,b) => b[1] - a[1]);
        
        sortedGenres.forEach(([genre, count]) => {
            const btn = document.createElement('button');
            btn.className = 'filter-badge';
            btn.setAttribute('data-filter', genre);
            btn.innerHTML = `${genre} <span class="badge-count">${count}</span>`;
            btn.addEventListener('click', () => handleFilterClick('genre', genre, btn));
            genreFiltersContainer.appendChild(btn);
        });

        // Platform filter setup
        const platformFiltersContainer = document.getElementById('platform-filters');
        const sortedPlatforms = Object.entries(stats.platformsCount).sort((a,b) => b[1] - a[1]);
        
        sortedPlatforms.forEach(([platform, count]) => {
            const btn = document.createElement('button');
            btn.className = 'filter-badge';
            btn.setAttribute('data-filter', platform);
            btn.innerHTML = `${platform} <span class="badge-count">${count}</span>`;
            btn.addEventListener('click', () => handleFilterClick('platform', platform, btn));
            platformFiltersContainer.appendChild(btn);
        });

        // Add click listener to the 'All' buttons
        document.querySelector('[data-filter="all-genres"]').addEventListener('click', (e) => {
            handleFilterClick('genre', 'all-genres', e.currentTarget);
        });
        document.querySelector('[data-filter="all-platforms"]').addEventListener('click', (e) => {
            handleFilterClick('platform', 'all-platforms', e.currentTarget);
        });
    }

    // Handle Filter Clicks
    function handleFilterClick(type, val, btnElement) {
        if (type === 'genre') {
            activeGenreFilter = val;
            document.querySelectorAll('#genre-filters .filter-badge').forEach(b => b.classList.remove('active'));
        } else {
            activePlatformFilter = val;
            document.querySelectorAll('#platform-filters .filter-badge').forEach(b => b.classList.remove('active'));
        }
        btnElement.classList.add('active');
        renderDramas();
    }

    // Filter and Render Drama Cards
    function renderDramas() {
        const listContainer = document.getElementById('dramas-list');
        listContainer.innerHTML = '';

        const filtered = dramasData.filter(d => {
            // Genre matching
            const matchesGenre = activeGenreFilter === 'all-genres' || d.genre.split('、').map(g=>g.trim()).includes(activeGenreFilter);
            // Platform matching
            const matchesPlatform = activePlatformFilter === 'all-platforms' || d.platform.split('、').map(p=>p.trim()).includes(activePlatformFilter);
            // Search text matching
            const matchesSearch = !searchQuery || 
                d.title.toLowerCase().includes(searchQuery) ||
                d.cast.toLowerCase().includes(searchQuery) ||
                d.summary.toLowerCase().includes(searchQuery) ||
                d.genre.toLowerCase().includes(searchQuery) ||
                d.platform.toLowerCase().includes(searchQuery);

            return matchesGenre && matchesPlatform && matchesSearch;
        });

        document.getElementById('filtered-count').innerText = filtered.length;

        if (filtered.length === 0) {
            listContainer.innerHTML = `
                <div class="no-results">
                    <i class="fa-regular fa-folder-open"></i>
                    <h3>未找到符合篩選條件的劇集</h3>
                    <p>試著清除關鍵字搜尋或重置類型、平台篩選條件。</p>
                </div>
            `;
            return;

            const platformsHTML = d.platform.split('、').map(p => {

                return `<span class="platform-badge"><i class="fa-solid ${iconClass}"></i> ${p.trim()}</span>`;

                    </div>
                    <div class="drama-badges">
                        ${genresHTML}
                        ${platformsHTML}
                    </div>
                </div>
                <div class="drama-summary">
                    <button class="toggle-btn" onclick="toggleSummary(this)">
                        <i class="fa-solid fa-chevron-down"></i> 展開劇集詳細簡介與故事大綱
                    </button>
                    <div class="summary-content" style="margin-top: 1rem; border-left: 2px solid var(--accent-indigo); padding-left: 1rem; color: var(--text-primary);">
                        ${d.summary}
                    </div>
                </div>
            `;
            listContainer.appendChild(card);
        });
    }

    // Toggle Summary Action
    window.toggleSummary = function(btn) {
        const content = btn.nextElementSibling;
        btn.classList.toggle('active');
        content.classList.toggle('show');
        
        if (content.classList.contains('show')) {
            btn.innerHTML = `<i class="fa-solid fa-chevron-down"></i> 收合劇集詳細簡介`;
        } else {
            btn.innerHTML = `<i class="fa-solid fa-chevron-down"></i> 展開劇集詳細簡介與故事大綱`;
        }
    };

    // Render Chart.js Visualizations
    function renderCharts() {
        const stats = getStats();
        
        // Chart.js global defaults for beautiful dark style
        Chart.defaults.color = '#94a3b8';
        Chart.defaults.font.family = "'Outfit', 'Noto Sans TC', sans-serif";

        // 1. Genre Bar Chart
        const sortedGenres = Object.entries(stats.genresCount).sort((a,b) => b[1] - a[1]);
        const genreLabels = sortedGenres.map(x => x[0]);
        const genreData = sortedGenres.map(x => x[1]);

        const ctxGenre = document.getElementById('genreChart').getContext('2d');
        
        // Create Gradient Accent
        const gradientGenre = ctxGenre.createLinearGradient(0, 0, 400, 0);
        gradientGenre.addColorStop(0, '#6366f1');
        gradientGenre.addColorStop(1, '#a855f7');

        new Chart(ctxGenre, {
            type: 'bar',
            data: {
                labels: genreLabels,
                datasets: [{
                    label: '劇集數量',
                    data: genreData,
                    backgroundColor: gradientGenre,
                    borderColor: 'rgba(255,255,255,0.05)',
                    borderWidth: 1,
                    borderRadius: 6,
                    barPercentage: 0.65
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                indexAxis: 'y', // horizontal bar chart
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        backgroundColor: '#1e293b',
                        titleColor: '#fff',
                        bodyColor: '#cbd5e1',
                        borderWidth: 1,
                        borderColor: 'rgba(255,255,255,0.1)'
                    }
                },
                scales: {
                    x: {
                        grid: { color: 'rgba(255,255,255,0.05)' },
                        ticks: { stepSize: 1 }
                    },
                    y: {
                        grid: { display: false }
                    }
                }
            }
        });

        // 2. Platform Doughnut Chart
        const sortedPlatforms = Object.entries(stats.platformsCount).sort((a,b) => b[1] - a[1]);
        const platformLabels = sortedPlatforms.map(x => x[0]);
        const platformData = sortedPlatforms.map(x => x[1]);

        const ctxPlatform = document.getElementById('platformChart').getContext('2d');
        new Chart(ctxPlatform, {
            type: 'doughnut',
            data: {
                labels: platformLabels,
                datasets: [{
                    data: platformData,
                    backgroundColor: [
                        '#6366f1', // Indigo
                        '#a855f7', // Purple
                        '#06b6d4', // Cyan
                        '#ec4899', // Pink
                        '#f59e0b', // Amber
                        '#10b981', // Emerald
                        '#3b82f6', // Blue
                        '#ef4444', // Red
                        '#84cc16', // Lime
                        '#6b7280'  // Gray
                    ],
                    borderWidth: 2,
                    borderColor: '#131a2e'
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        position: 'right',
                        labels: {
                            boxWidth: 12,
                            padding: 15,
                            font: { size: 11 }
                        }
                    },
                    tooltip: {
                        backgroundColor: '#1e293b',
                        titleColor: '#fff',
                        bodyColor: '#cbd5e1',
                        borderWidth: 1,
                        borderColor: 'rgba(255,255,255,0.1)'
                    }
                },
                cutout: '60%'
            }
        });
    }
</script>
</body>
</html>
